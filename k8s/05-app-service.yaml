# ─────────────────────────────────────────────────────────────────────────────
# Node.js App – Service (NodePort)
# ─────────────────────────────────────────────────────────────────────────────
# NodePort exposes the service on a static port on every cluster node.
# With Docker Desktop, "localhost:30000" → this service → the app pod.
#
# Service types quick-reference:
#   ClusterIP  – cluster-internal only (used for postgres above)
#   NodePort   – exposed on node IP:port (what we use here for easy local access)
#   LoadBalancer – cloud load balancer (not needed locally)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sharding-app
  namespace: sharding-demo
spec:
  type: NodePort
  selector:
    app: sharding-app
  ports:
    - port: 3000        # port inside the cluster
      targetPort: 3000  # port on the pod
      nodePort: 30000   # port on localhost (must be 30000-32767)
