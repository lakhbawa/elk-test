# ─────────────────────────────────────────────────────────────────────────────
# Secret – PostgreSQL password
# ─────────────────────────────────────────────────────────────────────────────
# Secrets store sensitive data (passwords, tokens).
# They are base64-encoded inside etcd and injected into pods as environment
# variables so passwords never appear in plain text in your Deployment YAML.
#
# stringData lets you write the raw value; Kubernetes encodes it for you.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: sharding-demo
type: Opaque
stringData:
  password: "postgres123"
