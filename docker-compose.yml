services:
  postgres-primary:
    image: postgres:16
    container_name: postgres-primary
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=appdb
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./docker/primary-init:/docker-entrypoint-initdb.d:ro

  postgres-replica:
    image: postgres:16
    container_name: postgres-replica
    depends_on:
      - postgres-primary
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=appdb
      - PRIMARY_HOST=postgres-primary
      - PRIMARY_PORT=5432
      - REPLICATION_USER=repl_user
      - REPLICATION_PASSWORD=repl_password
    entrypoint:
      - /bin/bash
      - /replica-entrypoint.sh
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./docker/replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro

  adminer:
    image: adminer:4
    container_name: adminer
    depends_on:
      - postgres-primary
      - postgres-replica
    ports:
      - "8080:8080"

  app:
    image: node:20-alpine
    container_name: replica-demo-app
    depends_on:
      - postgres-primary
      - postgres-replica
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PRIMARY_HOST=postgres-primary
      - PRIMARY_PORT=5432
      - REPLICA_HOST=postgres-replica
      - REPLICA_PORT=5432
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=appdb
    command: sh -c "npm install && npm run demo"

volumes:
  primary_data:
  replica_data:
