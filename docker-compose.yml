services:
  postgres-primary:
    image: bitnami/postgresql:latest
    container_name: postgres-primary
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=app
      - POSTGRESQL_PASSWORD=app_password
      - POSTGRESQL_DATABASE=appdb
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
    volumes:
      - primary_data:/bitnami/postgresql

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: postgres-replica
    depends_on:
      - postgres-primary
    ports:
      - "5433:5432"
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=app
      - POSTGRESQL_PASSWORD=app_password
      - POSTGRESQL_DATABASE=appdb
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
    volumes:
      - replica_data:/bitnami/postgresql

  adminer:
    image: adminer:4
    container_name: adminer
    depends_on:
      - postgres-primary
      - postgres-replica
    ports:
      - "8080:8080"

  app:
    image: node:20-alpine
    container_name: replica-demo-app
    depends_on:
      - postgres-primary
      - postgres-replica
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PRIMARY_HOST=postgres-primary
      - PRIMARY_PORT=5432
      - REPLICA_HOST=postgres-replica
      - REPLICA_PORT=5432
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=appdb
    command: sh -c "npm install && npm run demo"

  partition-app:
    image: node:20-alpine
    container_name: partition-demo-app
    depends_on:
      - postgres-primary
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PRIMARY_HOST=postgres-primary
      - PRIMARY_PORT=5432
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=appdb
    command: sh -c "npm install && npm run partition"
    profiles:
      - partition

  postgres-shard0:
    image: bitnami/postgresql:latest
    container_name: postgres-shard0
    ports:
      - "5434:5432"
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=app
      - POSTGRESQL_PASSWORD=app_password
      - POSTGRESQL_DATABASE=appdb
    volumes:
      - shard0_data:/bitnami/postgresql
    profiles:
      - sharding

  postgres-shard1:
    image: bitnami/postgresql:latest
    container_name: postgres-shard1
    ports:
      - "5435:5432"
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=app
      - POSTGRESQL_PASSWORD=app_password
      - POSTGRESQL_DATABASE=appdb
    volumes:
      - shard1_data:/bitnami/postgresql
    profiles:
      - sharding

  shard-app:
    image: node:20-alpine
    container_name: shard-demo-app
    depends_on:
      - postgres-shard0
      - postgres-shard1
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - SHARD0_HOST=postgres-shard0
      - SHARD0_PORT=5432
      - SHARD1_HOST=postgres-shard1
      - SHARD1_PORT=5432
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=appdb
    command: sh -c "npm install && npm run shard"
    profiles:
      - sharding

volumes:
  primary_data:
  replica_data:
  shard0_data:
  shard1_data:
