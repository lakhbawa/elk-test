# Logstash pipeline for ingesting simulated Nginx-style access logs
# into Elasticsearch for the Log Analysis demo.

input {
  # Read from the generated sample log file
  file {
    path => "/usr/share/logstash/input_logs/nginx-access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }

  # Also accept logs via TCP (port 5044 for Beats or direct sends)
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Parse combined Nginx log format
  if [message] =~ /^\d+\.\d+\.\d+\.\d+/ {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:raw_timestamp}\] "%{WORD:http_method} %{DATA:path} HTTP/%{NUMBER:http_version}" %{NUMBER:status_code:int} %{NUMBER:response_bytes:int} "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
    }

    date {
      match => ["raw_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["raw_timestamp"]
    }

    # Derive log level from HTTP status code
    if [status_code] >= 500 {
      mutate { add_field => { "level" => "ERROR" } }
    } else if [status_code] >= 400 {
      mutate { add_field => { "level" => "WARN" } }
    } else {
      mutate { add_field => { "level" => "INFO" } }
    }

    mutate {
      add_field => {
        "host" => "nginx-logstash"
        "source" => "nginx-access"
        "message" => "%{http_method} %{path} -> %{status_code}"
      }
    }
  }

  # Drop if grok failed
  if "_grokparsefailure" in [tags] {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"]
    user => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    index => "app-logs-%{+YYYY.MM.dd}"
    ssl_enabled => false
  }
}
